[package]
name = "fluke-connect-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Read live measurements from Fluke Connect Bluetooth Low Energy meters and adapters (ir3000 FC, 3000 FC family)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jwanga/fluke-connect-client"
documentation = "https://docs.rs/fluke-connect-client"
keywords = ["fluke", "bluetooth", "ble", "multimeter", "gatt"]
categories = ["hardware-support", "asynchronous", "parser-implementations"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/PROTOCOL.md",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "ble"]
# Enables the async client, transport trait and error conversions that need `std`.
std = ["thiserror/std", "dep:futures-util", "serde?/std"]
# Built-in Bluetooth transport backed by btleplug (macOS, Linux, Windows).
ble = ["std", "dep:btleplug", "dep:tokio", "dep:uuid", "tokio/macros"]
# Emit `tracing` events from the built-in backend.
tracing = ["dep:tracing"]
# `serde` derives on protocol types.
serde = ["dep:serde", "serde/alloc"]
# The `fluke-connect` diagnostic command-line tool.
cli = [
    "ble",
    "tracing",
    "serde",
    "dep:clap",
    "dep:serde_json",
    "dep:tracing-subscriber",
    "dep:anyhow",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tokio/time",
    "tokio/io-util",
    "tokio/fs",
]

[[bin]]
name = "fluke-connect"
path = "src/bin/fluke-connect.rs"
required-features = ["cli"]

[[example]]
name = "stream"
required-features = ["ble"]

[dependencies]
thiserror = { version = "2.0", default-features = false }
btleplug = { version = "0.13", optional = true }
tokio = { version = "1.53", optional = true, default-features = false, features = ["sync", "rt", "time"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
uuid = { version = "1.26", optional = true }
tracing = { version = "0.1", optional = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
clap = { version = "4.6", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
proptest = "1.11"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
# Lint groups. Priority -1 lets the individual entries below override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Restriction lints that are compatible with each other and with pedantic.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "warn"
exit = "warn"
mem_forget = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
shadow_unrelated = "warn"
same_name_method = "warn"
allow_attributes_without_reason = "warn"
# Deliberate allows, each with a reason.
# btleplug's dependency tree pulls in several versions of some crates; nothing this crate can fix.
multiple_crate_versions = "allow"
# `Result<T, Error>` aliases are idiomatic for library crates.
module_name_repetitions = "allow"
