name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Bluetooth build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-features --all-targets
      - run: cargo clippy --no-default-features --all-targets
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo build --all-features --examples --bins
      # Intra-doc links must resolve in every feature subset, not just docs.rs.
      - run: cargo doc --no-default-features --no-deps
      - run: cargo doc --no-default-features --features std --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # `+1.88` overrides rust-toolchain.toml, which pins stable.
      - run: cargo +1.88 check --all-features --all-targets

  no-std:
    name: no_std protocol build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features --target thumbv7em-none-eabihf

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `+nightly` overrides rust-toolchain.toml; `--cfg docsrs` mirrors docs.rs.
      - run: cargo +nightly doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  package:
    name: Package contents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail if the published file list changed without review
        run: |
          cargo package --list --allow-dirty | LC_ALL=C sort > packaged.txt
          diff -u .github/expected-package-files.txt packaged.txt
